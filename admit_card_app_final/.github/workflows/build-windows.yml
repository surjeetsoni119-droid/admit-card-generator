name: Build Windows EXE

# Runs automatically whenever you push code, and lets you trigger it manually too.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # <-- this is the free Windows machine in the cloud

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: admit_card_app_final
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        working-directory: admit_card_app_final
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "AdmitCardGenerator" `
            --collect-all customtkinter `
            --collect-all reportlab `
            --collect-data pandas `
            --hidden-import PIL._tkinter_finder `
            main.py

      - name: Upload EXE as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdmitCardGenerator-windows
          path: admit_card_app_final/dist/AdmitCardGenerator.exe
